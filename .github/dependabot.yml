# One weekly pull request per ecosystem, with releases out for a week first: CI checks it like any
# other change. Majors are upgraded on purpose, never proposed. Actions are pinned by commit;
# Dependabot moves the pin and its version comment. npm here is only the development tools (Ultracite,
# TypeScript): the package itself has no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        patterns: ["*"]
    commit-message:
      prefix: "Dependencies"
