name: Release

# Pushing the tag `v<version>` publishes that version to npm, with provenance, and makes its GitHub
# release from CHANGELOG.md. The tag must name the version in package.json, point at a commit of
# main, and that commit's CI must have passed. A prerelease (`v1.1.0-rc.1`) goes to npm's `next`
# tag, never to `latest`. See CONTRIBUTING.md, Releases.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything is published: a release is a commit main already validated, never a branch, and
  # never a commit whose checks failed or were cancelled by a later merge.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Require the tag to be package.json's version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          version=$(jq -r .version package.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match package.json's version $version."
            exit 1
          fi
          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Require a commit of main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main. Tag a commit of main."
            exit 1
          fi

      # A tag pushed right after a merge waits for main's CI on that commit rather than failing.
      - name: Require main's CI to have passed
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 50 * 60))
          while :; do
            run=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // {} | {status: (.status // "missing"), conclusion: (.conclusion // "")}')
            echo "CI on $GITHUB_SHA: $run"
            status=$(jq -r .status <<< "$run")
            conclusion=$(jq -r .conclusion <<< "$run")
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then
              exit 0
            fi
            if [ "$status" = completed ]; then
              echo "::error::main's CI did not pass on $GITHUB_SHA ($conclusion). Tag a commit whose checks are green."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::main's CI on $GITHUB_SHA did not finish in time."
              exit 1
            fi
            sleep 30
          done

  publish:
    name: Publish to npm
    needs: verify
    # GitHub's runners: npm only attests provenance, and only allows trusted publishing, from them.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protection rules (required reviewers, tags allowed) can be set on this environment.
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache here: a poisoned cache must not reach what is published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # prepublishOnly runs the linter, the types and the unit tests once more on this exact commit.
      - run: npm ci

      # Trusted publishing (OIDC) when the package is set up for it on npmjs.com; otherwise NPM_TOKEN,
      # a granular token that can only publish this package. A version already on npm is left as it
      # is, so a failed release can be run again.
      - name: Publish
        run: |
          if npm view "@boelabs/postgres@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@boelabs/postgres@$VERSION is already on npm."
            exit 0
          fi
          npm publish --provenance --access public --tag "${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The GitHub release carries the version's section of the changelog.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The release $TAG exists already."
            exit 0
          fi
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            ${{ needs.verify.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
