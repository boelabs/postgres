name: CI

# Pull requests and main. Nothing here publishes: a release is a `v<version>` tag on a commit of main
# whose checks all passed (release.yml).
#
# The integration tests run in the image of tests/docker, the same one `npm run test:docker` runs
# locally: PostgreSQL, Node.js and Bun at the versions of the matrix, with the two test servers
# tests/setup.sh starts. What passes here passes on a contributor's machine, whatever its OS.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  # A new push to a pull request replaces its running checks; every commit on main runs to the end.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:types
      # Every link between the Markdown files, the README's links to docs/ included, leads somewhere.
      - run: npm run check:docs
      # The package is src/*.js and the types, with no dependencies: anything else in the tarball is
      # a mistake that would reach every user.
      - name: Check what the package publishes
        run: |
          set -euo pipefail
          files=$(npm pack --dry-run --json | jq -r '.[0].files[].path' | sort)
          echo "$files"
          unexpected=$(echo "$files" | grep -vxE 'src/[a-z]+\.js|types/index\.d\.ts|package\.json|README\.md|LICENSE|CHANGELOG\.md' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files in the package: $unexpected"
            exit 1
          fi
          if [ "$(jq '[.dependencies, .peerDependencies, .optionalDependencies] | map(. // {} | length) | add' package.json)" != 0 ]; then
            echo "::error::The package must have no dependencies."
            exit 1
          fi

  node:
    name: Node.js ${{ matrix.node }} · PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The LTS lines from the oldest one supported (package.json engines) to the newest.
        node: ["24", "26"]
        # Every PostgreSQL release the PostgreSQL project still supports.
        postgres: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit, integration and simulation tests
        run: sh tests/docker/run.sh
        env:
          PG: ${{ matrix.postgres }}
          NODE: ${{ matrix.node }}

  bun:
    name: Bun ${{ matrix.bun }} · PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4"]
        # The oldest and the newest server are enough to see Bun's own differences.
        postgres: ["14", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit, integration and simulation tests on Bun
        run: sh tests/docker/run.sh sh -c 'bun tests/unit/index.js && bun tests/index.js && bun tests/simulate.js'
        env:
          PG: ${{ matrix.postgres }}
          BUN: ${{ matrix.bun }}

  workers:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checks run in workerd (wrangler dev) against the test server, directly and through the
      # Hyperdrive binding, once tests/bootstrap.js has made the test users. Workers always verify
      # certificates, so workerd trusts the server's own. The container's user writes wrangler's log
      # and the result next to the Worker.
      - name: Workers checks in workerd
        run: |
          chmod a+w tests/cf
          sh tests/docker/run.sh sh -c '
            export NODE_EXTRA_CA_CERTS=$PGTEST_DIR/5432/server.crt
            node tests/bootstrap.js &&
            sh tests/cf/run.sh && cat tests/cf/result.json && echo &&
            CHECK=hyperdrive sh tests/cf/run.sh && cat tests/cf/result.json'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workers-results
          path: |
            tests/cf/result.json
            tests/cf/wrangler.log
          retention-days: 7
          if-no-files-found: ignore
