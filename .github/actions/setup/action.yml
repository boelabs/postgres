name: Setup
description: Node.js and pnpm at the repository's versions (.nvmrc, packageManager), and the development tools.

inputs:
  cache:
    description: Restore and save the pnpm store. Off where a poisoned cache could reach a release.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - run: pnpm install --frozen-lockfile
      shell: bash
